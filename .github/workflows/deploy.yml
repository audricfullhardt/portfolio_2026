name: CI/CD Portfolio Preprod & Prod

on:
  push:
    branches:
      - main
      - preprod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build
          path: out

  deploy-preprod:
    needs: build
    if: github.ref == 'refs/heads/preprod'
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-build
          path: out

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to PREPROD (Apache)
        run: |
          scp -r -o StrictHostKeyChecking=no out/* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/portfolio-preprod/out

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-build
          path: out

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to PROD (Apache)
        run: |
          scp -r -o StrictHostKeyChecking=no out/* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/portfolio/out